<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Focus Lock</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="setup" class="screen">
  <h1>Focus Lock</h1>
  <label>कितने मिनट? (0.1 = 6 सेकंड)</label>
  <input id="mins" type="number" step="any" min="0.1" value="25">
  <label>स्क्रीन पर क्या दिखे?</label>
  <input id="msg" value="फ़ोकस करो 💪">
  <label>अनलॉक पासवर्ड</label>
  <input id="pw" type="password">
  <button id="startBtn">लॉक शुरू करो</button>
</div>

<div id="lock" class="screen hidden">
  <div id="lockMsg"></div>
  <div id="timer"></div>
  <button id="unlockBtn">🔓</button>
  <div id="pwBox" class="hidden">
    <input id="pwIn" type="password" placeholder="पासवर्ड">
    <button id="pwOk">OK</button>
    <button id="pwCancel">✕</button>
    <p id="err"></p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
